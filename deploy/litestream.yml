# The B2 values and the key come from /etc/bunker/litestream.env, which the
# unit loads. Litestream reads LITESTREAM_ACCESS_KEY_ID and
# LITESTREAM_SECRET_ACCESS_KEY from the environment on its own.
dbs:
  - path: /var/lib/bunker/bunker.db
    replica:
      type: s3
      bucket: ${B2_BUCKET}
      path: bunker
      endpoint: ${B2_ENDPOINT}
      region: ${B2_REGION}
      # Writes come in bursts on event nights. One upload per 10 seconds keeps
      # the request count low, and a stop of the unit uploads the rest first.
      sync-interval: 10s

# B2 gives 2,500 free class C calls a day, and a bucket list is one. Each L0
# check and each compaction lists the bucket, even when nothing changed, and the
# defaults (a check every 15s) make about 11,500 a day. Hourly timers make about
# 75. Uploads are class A, so a busy night adds almost none.
l0-retention: 1h
l0-retention-check-interval: 1h
levels:
  - interval: 1h

# A daily full copy, kept a week. A restore lands on an hour boundary inside it,
# or on any sync of the last hour.
snapshot:
  interval: 24h
  retention: 168h
