version: 2
# Updates land on dev first, like every other change, and reach main through CI.
updates:
    - package-ecosystem: cargo
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      groups:
          cargo-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /web
      target-branch: dev
      schedule:
          interval: weekly
      groups:
          npm-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      groups:
          actions-minor-patch:
              update-types: [minor, patch]
