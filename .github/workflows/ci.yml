name: ci

on:
    push:
        branches: [main, dev]
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    DATABASE_URL: sqlite://.dev/bunker.db?mode=rwc

jobs:
    rust:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            # One key for the rust and the e2e jobs, so the second reuses what
            # the first compiled.
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: rust

            - uses: ./.github/actions/scratch-db

            - name: Format
              run: cargo fmt --all --check

            - name: Lint
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace

            - name: Check nothing is ignored
              run: |
                  list=$(cargo test --workspace -- --ignored --list)
                  ignored=$(printf '%s\n' "$list" | grep -c ': test$' || true)
                  if [ "$ignored" -ne 0 ]; then
                    echo "expected no ignored tests, found $ignored"
                    printf '%s\n' "$list"
                    exit 1
                  fi

    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - run: cargo install cargo-audit --locked

            - run: cargo audit

    web:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: web/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            # The lockfile holds svgo (through astro) and smol-toml (through
            # @astrojs/cloudflare) at versions with high advisories. Remove
            # continue-on-error when this step passes.
            - run: pnpm audit --prod --audit-level high
              continue-on-error: true

            - run: pnpm fmt:check

            # `astro:env` and the other virtual modules exist only after a sync.
            - run: pnpm exec astro sync

            - run: pnpm typecheck

            - run: pnpm lint

            - run: pnpm check

            - run: pnpm build

            - name: Check the generated API types are current
              run: |
                  pnpm exec openapi-typescript ../crates/bunker-api/openapi.json -o /tmp/api-types.d.ts
                  pnpm exec oxfmt /tmp/api-types.d.ts
                  diff -u src/lib/api-types.d.ts /tmp/api-types.d.ts

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [rust, web]
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: rust

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: web/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - uses: ./.github/actions/scratch-db

            - run: pnpm install --frozen-lockfile
              working-directory: web

            - run: pnpm exec playwright install --with-deps chromium
              working-directory: web

            # Playwright starts the API with a build of its own, but a cold build
            # takes longer than the three minutes it waits. This step does the
            # build first, so the one inside Playwright finds nothing to do.
            - run: cargo build -p bunker-api

            - run: pnpm exec playwright test
              working-directory: web

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-results
                  path: web/test-results
                  retention-days: 7

    deploy-api:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [rust, web, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        concurrency:
            group: deploy-api
            cancel-in-progress: false
        env:
            # musl: the binary needs no glibc on the box.
            TARGET: x86_64-unknown-linux-musl
            API_HOST: ${{ vars.API_HOST }}
            SSH_HOST: ${{ vars.SSH_HOST }}
        steps:
            # An empty value gives an opaque ssh error later. Stop here with the name.
            - name: Check the configuration
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  missing=0
                  for name in DEPLOY_SSH_KEY API_HOST SSH_HOST; do
                    if [ -z "${!name}" ]; then echo "missing $name" >&2; missing=1; fi
                  done
                  exit $missing

            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-musl

            - uses: Swatinem/rust-cache@v2
              with:
                  key: deploy-musl

            - run: sudo apt-get install -y --no-install-recommends musl-tools

            - uses: ./.github/actions/scratch-db

            - name: Build
              env:
                  BUNKER_GIT_SHA: ${{ github.sha }}
              run: cargo build --release --locked -p bunker-api --target "$TARGET"

            - name: Install cloudflared
              run: |
                  sudo install -d -m 755 /usr/share/keyrings
                  curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
                  echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
                    | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
                  sudo apt-get update -q
                  sudo apt-get install -y -q cloudflared

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  if [ -n "$SSH_KNOWN_HOSTS" ]; then
                    printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                    checking=yes
                  else
                    echo "::warning::SSH_KNOWN_HOSTS is not set, so the runner trusts the first host key it sees"
                    checking=accept-new
                  fi
                  cat > ~/.ssh/config <<CONF
                  Host bunker
                    HostName $SSH_HOST
                    User deploy
                    IdentityFile ~/.ssh/deploy
                    IdentitiesOnly yes
                    UserKnownHostsFile ~/.ssh/known_hosts
                    StrictHostKeyChecking $checking
                    ProxyCommand cloudflared access ssh --hostname %h
                  CONF

            - name: Upload the binary
              run: scp "target/$TARGET/release/bunker-api" bunker:bunker-api.new

            - name: Install and restart
              run: ssh bunker sudo /usr/local/sbin/bunker-deploy

            - name: Check the public endpoint
              run: curl -fsS "https://$API_HOST/health/ready"

            # The commit in the answer proves that the public name reaches the
            # binary this run built.
            - name: Check the public endpoint runs this commit
              run: |
                  live=$(curl -fsS "https://$API_HOST/health/live")
                  if ! printf '%s' "$live" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null; then
                    echo "expected commit $GITHUB_SHA, /health/live answered: $live" >&2
                    exit 1
                  fi

    # After the API, so each route that the new site calls exists when it ships.
    deploy-web:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [deploy-api]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        concurrency:
            group: deploy-web
            cancel-in-progress: false
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: web/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - run: pnpm build

            - uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: web
