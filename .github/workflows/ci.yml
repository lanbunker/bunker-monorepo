name: ci

on:
    push:
        branches: [main, dev]
    pull_request:

env:
    CARGO_TERM_COLOR: always
    DATABASE_URL: sqlite://.dev/bunker.db?mode=rwc

jobs:
    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            # The sqlx macros check each query against a real schema at compile
            # time. The runner has sqlite3, so the migrations build that schema.
            - name: Migrate a scratch database
              run: |
                  mkdir -p .dev
                  for file in crates/bunker-api/migrations/*.sql; do sqlite3 .dev/bunker.db < "$file"; done

            - name: Format
              run: cargo fmt --all --check

            - name: Lint
              run: cargo clippy --workspace --all-targets -- -D warnings

            # Each test creates its own SQLite file, so no service is needed.
            - name: Test
              run: cargo test --workspace

            - name: Check nothing is ignored
              run: |
                  ignored=$(cargo test --workspace -- --ignored --list 2>/dev/null | grep -c ': test' || true)
                  if [ "$ignored" -ne 0 ]; then
                    echo "expected no ignored tests, found $ignored"
                    cargo test --workspace -- --ignored --list
                    exit 1
                  fi

    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: web/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - run: pnpm exec oxfmt --check

            - run: pnpm lint

            - run: pnpm exec astro check

            - run: pnpm build

            # The TypeScript API types are generated from openapi.json and committed.
            - name: Check the generated API types are current
              run: |
                  pnpm exec openapi-typescript ../crates/bunker-api/openapi.json -o /tmp/api-types.d.ts
                  pnpm exec oxfmt /tmp/api-types.d.ts
                  diff -u src/lib/api-types.d.ts /tmp/api-types.d.ts

    e2e:
        runs-on: ubuntu-latest
        needs: [rust, web]
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: web/package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            # The API compiles against a migrated database, as in the rust job.
            - name: Migrate a scratch database
              run: |
                  mkdir -p .dev
                  for file in crates/bunker-api/migrations/*.sql; do sqlite3 .dev/bunker.db < "$file"; done

            - run: pnpm install --frozen-lockfile
              working-directory: web

            - run: pnpm exec playwright install --with-deps chromium
              working-directory: web

            # Playwright builds and starts the API on its own database, then the site.
            - run: pnpm exec playwright test
              working-directory: web

    # Ships the API to the container behind the Cloudflare Tunnel. Only after
    # every other job is green, and only for a push to main, so a red build never
    # reaches the box. The site deploys on its own in deploy.yml.
    deploy-api:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [rust, web, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        concurrency:
            group: deploy-api
            cancel-in-progress: false
        env:
            TARGET: x86_64-unknown-linux-musl
            API_HOST: ${{ vars.API_HOST }}
            SSH_HOST: ${{ vars.SSH_HOST }}
        steps:
            # An empty secret makes cloudflared fall back to a browser login and
            # hang. Stop here with the name instead.
            - name: Check the configuration
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: |
                  missing=0
                  for name in DEPLOY_SSH_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET API_HOST SSH_HOST; do
                    if [ -z "${!name}" ]; then echo "missing $name" >&2; missing=1; fi
                  done
                  exit $missing

            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-musl

            - uses: Swatinem/rust-cache@v2
              with:
                  key: deploy-musl

            # A static binary runs on any x86_64 Linux, whatever glibc the box has.
            - run: sudo apt-get install -y --no-install-recommends musl-tools

            - name: Migrate a scratch database
              run: |
                  mkdir -p .dev
                  for file in crates/bunker-api/migrations/*.sql; do sqlite3 .dev/bunker.db < "$file"; done

            - name: Build
              run: cargo build --release --locked -p bunker-api --target "$TARGET"

            # The signed Cloudflare repository, the same source the box uses.
            - name: Install cloudflared
              run: |
                  sudo install -d -m 755 /usr/share/keyrings
                  curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
                  echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
                    | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
                  sudo apt-get update -q
                  sudo apt-get install -y -q cloudflared

            # Without the Access policy the SSH name has nothing in front of sshd.
            # Access answers an unauthenticated request with a redirect to the
            # team login page. Anything else stops the deploy.
            - name: Check that Access guards the SSH name
              run: |
                  location=$(curl -sI "https://$SSH_HOST/" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
                  case "$location" in
                    *cloudflareaccess.com*) echo "access redirects to the login page" ;;
                    *) echo "no Access redirect on $SSH_HOST. add the Access application for the SSH name first" >&2; exit 1 ;;
                  esac

            # SSH goes through Cloudflare Access. The box has no open port, and
            # only this service token passes the Access policy. cloudflared reads
            # the token from the two TUNNEL_SERVICE_TOKEN names.
            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  cat > ~/.ssh/config <<CONF
                  Host bunker
                    HostName $SSH_HOST
                    User deploy
                    IdentityFile ~/.ssh/deploy
                    IdentitiesOnly yes
                    StrictHostKeyChecking accept-new
                    ProxyCommand cloudflared access ssh --hostname %h
                  CONF

            - name: Upload the binary
              env:
                  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: scp "target/$TARGET/release/bunker-api" bunker:bunker-api.new

            - name: Install and restart
              env:
                  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: ssh bunker sudo /usr/local/sbin/bunker-deploy

            - name: Check the public endpoint
              run: curl -fsS "https://$API_HOST/health/ready"
